# secret-scan — scans the pull request's working tree for committed secrets with gitleaks.
#
# Advisory: the job is not a required check, so a finding is visible but does not block a merge.
#
# Runs the open-source gitleaks binary directly (no third-party Action), pinned to a specific
# release, so the scan is self-contained and free on any plan or visibility.
name: secret-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the working tree for committed secrets (advisory — warns, never blocks)
        run: |
          ./gitleaks dir . --no-banner --redact --exit-code 1 \
            || { echo "::warning::A possible secret was found. This is a WARNING only — it does not block your merge. Review the finding above and remove the secret if it is real."; exit 1; }
