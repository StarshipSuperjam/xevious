# engine-guard — the guardrail-weakening classifier (required check #2).
# Runs on pull_request_target so the guard logic is read from the protected base
# branch: a pull request cannot tamper with the guard that judges it. It reads
# the diff via the API and NEVER checks out the pull request's head code — the
# workflow checks out only the base (trusted) branch. The job name `engine-guard`
# is the FROZEN check context bound in the branch ruleset; renaming it is itself
# a guardrail-weakening change.
#
# Core re-homed the guard onto the engine: the final step now invokes it
# through the validation dispatcher as the `custom/script` rule
# engine/check/guardrail-weakening, run BY ID (`validate.py --check`) rather than as
# part of the CI suite. The trigger, the base-only checkout, the permissions, and the
# env are UNCHANGED — only how the guard is invoked changed, never where or how it
# runs — so the "a pull request cannot run its own edited guard" property holds.
name: engine-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  engine-guard:
    name: engine-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base (trusted) branch — never the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
      - name: Materialize the engine tool-runtime
        run: uv sync --directory .engine --frozen
      - name: Guardrail-weakening classifier (reads the diff via API; never checks out head)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # The invocation is the CONDITION of an `if` because GitHub's implicit `bash -e {0}` is active
        # before our own `set` line runs — a bare invocation would abort the script on a hard finding,
        # skipping the log echo, the run-summary append, and the annotation on exactly the case they
        # exist to explain (an `if`-conditioned command is exempt from errexit). The rc capture must
        # never swallow the validator's exit code — a bare pipe/tee would turn required check #2
        # permanently green; a drift test (test_seed.py::TestWeakeningTiers) pins this shape.
        # Both ::warning:: annotations are STATIC text keyed on sentinels containing an em-dash or a
        # parenthesis — characters the guard's whitelist sanitizer strips from every PR-controlled
        # value, so PR content cannot forge either sentinel into the report.
        run: |
          set -uo pipefail
          out="$(mktemp)"
          if uv run --directory .engine --frozen -- python tools/validate.py --check engine/check/guardrail-weakening >"${out}" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          cat "${out}"
          {
            echo '## engine-guard'
            echo '```text'
            cat "${out}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "${rc}" -eq 0 ] && grep -q "GUARDRAIL DISCLOSURE —" "${out}"; then
            echo "::warning::Guardrail disclosure — this pull request modifies enforcement files. See the engine-guard run summary for the plain-language listing. No action needed; this does not block the merge."
          fi
          if [ "${rc}" -eq 0 ] && grep -q "ACKNOWLEDGED (guardrail-ack" "${out}"; then
            echo "::warning::Acknowledged guardrail change — a killswitch-tier change on this pull request was deliberately approved via the guardrail-ack label. The record is kept in the engine-guard run summary."
          fi
          exit "${rc}"
