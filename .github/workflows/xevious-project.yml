name: Xevious project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: xevious-project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run project tests
        run: python -m unittest discover -s tests -v
      - name: Verify the Scratch source and deterministic build
        run: python tools/scratch_project.py verify
