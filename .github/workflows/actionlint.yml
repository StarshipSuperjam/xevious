# actionlint — lints every .github/workflows/ file with actionlint: GitHub Actions expression syntax,
# job/step keys, `if:` conditions, known-action input shapes, and shellcheck over the `run:` blocks.
#
# Advisory: the job is not a required check, so a finding is visible but does not block a merge.
#
# Runs the open-source actionlint binary directly (no third-party Action), pinned to a specific
# release. actionlint checks how a workflow is WRITTEN, not whether it does what it intends — a clean
# lint means well-formed, not proven-to-work.
name: actionlint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version
      - name: Lint the workflows (advisory — warns, never blocks)
        run: |
          ./actionlint -color \
            || { echo "::warning::actionlint found a problem in a workflow file. This is a WARNING only — it does not block your merge. Review the finding above and fix the workflow if it is real."; exit 1; }
